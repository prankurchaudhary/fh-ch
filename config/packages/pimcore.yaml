framework:
    mailer:
        transports: null
    cache:
        default_redis_provider: '%env(REDIS_URL)%'

        app: cache.adapter.redis

        pools:
            cache.pimcore:
                adapter: cache.adapter.redis
                tags: true

        # 👇 THIS FIXES YOUR ERROR
        prefix_seed: pimcore
pimcore:
    full_page_cache:
        enabled: true
        lifetime: 3600
