security:
    password_hashers:
        App\Security\WebsiteUserAdapter:
            algorithm: auto
        Pimcore\Model\DataObject\WebsiteUser:
            algorithm: auto
    providers:
        pimcore_admin:
            id: Pimcore\Security\User\UserProvider
        website_user_provider:
            id: App\Security\WebsiteUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        
        api_login:
            pattern: ^/api/v1/login
            provider: website_user_provider
            stateless: true

            json_login:
                check_path: /api/v1/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api_token_refresh:
            pattern: ^/api/v1/token/refresh$
            provider: website_user_provider
            stateless: true

            refresh_jwt:
                check_path: /api/v1/token/refresh

        api:
            pattern: ^/api
            provider: website_user_provider
            stateless: true

            jwt: ~

        # Pimcore WebDAV HTTP basic // DO NOT CHANGE!
        pimcore_webdav:
            pattern: ^/asset/webdav
            provider: pimcore_admin
            http_basic: ~

        # Pimcore Admin Bundle firewall
        pimcore_admin: '%pimcore_admin_bundle.firewall_settings%'
        # admin:
        #     pattern: ^/admin
        #     provider: pimcore_admin
        #     stateless: false
        #     context: admin
        frontend:
            pattern: ^/
            provider: website_user_provider
            stateless: false
            context: frontend
            custom_authenticators:
                - App\Security\FormLoginAuthenticator
            entry_point: App\Security\FormLoginAuthenticator
            logout:
                path: /fe_logout
                target: /
                invalidate_session: true
            lazy: true
            form_login:
                login_path: frontend_login
                check_path: ajax_login  


    access_control:
        # Pimcore admin ACl  // DO NOT CHANGE!
        - { path: ^/api/v1/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/token/refresh$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1, roles: ROLE_USER }
        - { path: ^/admin/settings/display-custom-logo, roles: PUBLIC_ACCESS }
        - { path: ^/admin/login/2fa-verify, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin/login/2fa-setup, roles: ROLE_PIMCORE_USER }
        - { path: ^/admin/login/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/login/(login|lostpassword|deeplink|csrf-token)$, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_PIMCORE_USER }
        - { path: ^/asset/webdav, roles: ROLE_PIMCORE_USER }
        - { path: ^/profile, roles: ROLE_USER }
#        - { path: ^/reset-password, roles: IS_AUTHENTICATED_ANONYMOUSLY }

    role_hierarchy:
        # Pimcore admin  // DO NOT CHANGE!
        ROLE_PIMCORE_ADMIN: [ROLE_PIMCORE_USER]
